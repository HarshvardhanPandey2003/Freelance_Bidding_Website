apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: freelance-bidding-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/HarshvardhanPandey2003/freelance-bidding-gitops.git'
    targetRevision: minikube
    path: .
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc' # Internal address for the API server of the cluster
    namespace: freelance-hub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
