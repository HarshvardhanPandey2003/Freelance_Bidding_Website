apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backend-alerts
  namespace: freelance-hub
  labels:
    release: prometheus-stack
spec:
  groups:
  - name: backend.rules
    rules:
    - alert: HighCPUUsage
      # FIXED: Evaluates per pod and ignores the hidden Kubernetes 'pause' containers
      expr: sum(rate(container_cpu_usage_seconds_total{namespace="freelance-hub", pod=~"backend-.*", container!="POD", container!=""}[2m])) by (pod) > 0.5
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage on {{ $labels.pod }}"
        # Dynamically injects the pod name and the exact CPU value into the alert description
        description: "Pod {{ $labels.pod }} is consuming {{ $value }} CPU cores, which is above the 0.5 threshold for 1 minute."