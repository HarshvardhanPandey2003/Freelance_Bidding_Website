version: '3.8'

services:
  frontend:
    image: harshvardhan2003/freelance-frontend:latest
    ports:
      - "80:3000"
    networks:
      - app-network

  backend:
    image: harshvardhan2003/freelance-backend:latest
    ports:
      - "5000:5000"
    environment:
      - REDIS_URL=redis://redis-service:6379 
      # The ':-' tells compose to default to empty if not set in shell
      - MONGODB_URL=${MONGODB_URL:-}   
      - PORT=5000
    networks:
      - app-network

  redis-service:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network

volumes:
  redis_data:

networks:
  app-network: