name: Local DevOps Lifecycle (WSL)

on:
  push:
    branches: [ minikube ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      NAMESPACE: freelance-hub
      BACKEND_IMG: harshvardhan2003/freelance-backend:latest
      FRONTEND_IMG: harshvardhan2003/freelance-frontend:latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Ensure Namespace Exists
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Build and Patch Images (Podman)
        run: |
          podman build -t ${{ env.BACKEND_IMG }} ./backend
          podman build -t ${{ env.FRONTEND_IMG }} ./frontend
          # The || true prevents the pipeline from crashing if the tag already exists
          podman tag localhost/${{ env.BACKEND_IMG }} ${{ env.BACKEND_IMG }} || true
          podman tag localhost/${{ env.FRONTEND_IMG }} ${{ env.FRONTEND_IMG }} || true

      - name: Sideload Images to Minikube
        run: |
          echo "Injecting images into Minikube registry..."
          minikube image load ${{ env.BACKEND_IMG }}
          minikube image load ${{ env.FRONTEND_IMG }}

      - name: Validate Kubernetes Manifests
        run: |
          echo "Dry-run check to ensure YAML syntax is valid..."
          kubectl apply --dry-run=client -f k8s-manifests/configmaps/
          kubectl apply --dry-run=client -f k8s-manifests/deployments/

      - name: Infrastructure Sync
        run: |
          echo "Applying Secrets, ConfigMaps, and HPA..."
          kubectl apply -f k8s-manifests/secrets/local-secrets.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f k8s-manifests/configmaps/app-config.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f k8s-manifests/autoscaling/hpa-combined.yaml -n ${{ env.NAMESPACE }}

      - name: Zero-Downtime Deployment
        run: |
          echo "Deploying Application Components..."
          kubectl apply -f k8s-manifests/deployments/redis.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f k8s-manifests/deployments/backend.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f k8s-manifests/deployments/frontend.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f k8s-manifests/ingress/ingress.yaml -n ${{ env.NAMESPACE }}

      - name: Force Image Refresh
        run: |
          echo "Restarting pods to pull fresh sideloaded images..."
          kubectl rollout restart deployment/backend -n ${{ env.NAMESPACE }}
          kubectl rollout restart deployment/frontend -n ${{ env.NAMESPACE }}

      - name: Deployment Health Verification
        run: |
          echo "Verifying rollout status..."
          kubectl rollout status deployment/backend -n ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Post-Deploy Cleanup
        if: always()
        run: |
          echo "Cleaning up dangling Podman images to save disk space..."
          podman image prune -f