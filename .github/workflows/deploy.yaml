name: Local GitOps Lifecycle (WSL)

on:
  push:
    branches: [ minikube ]
  workflow_dispatch:

jobs:
  build-and-update-gitops:
    runs-on: self-hosted
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build and Stream Images to Minikube
        run: |
          echo "Building images natively on the WSL host..."
          podman build -t docker.io/harshvardhan2003/freelance-backend:${{ github.run_id }} ./backend
          podman build -t docker.io/harshvardhan2003/freelance-frontend:${{ github.run_id }} ./frontend
          
          echo "Streaming images directly into Minikube's containerd engine..."
          # This pipes the image archive over SSH directly into the cluster
          # No .tar files are ever written to your local SSD!
          podman save docker.io/harshvardhan2003/freelance-backend:${{ github.run_id }} | minikube ssh -- sudo ctr -n k8s.io images import -
          podman save docker.io/harshvardhan2003/freelance-frontend:${{ github.run_id }} | minikube ssh -- sudo ctr -n k8s.io images import -
      - name: Sideload Images to Minikube
        timeout-minutes: 3
        run: |
          echo "Loading physical tar archives directly into Minikube..."
          minikube image load backend.tar
          minikube image load frontend.tar

      - name: Update GitOps Repository
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          echo "Cloning GitOps repository..."
          # Clone the repo using the PAT for authentication
          git clone https://x-access-token:${GITOPS_PAT}@github.com/HarshvardhanPandey2003/freelance-bidding-gitops.git
          cd freelance-bidding-gitops
          
          echo "Injecting new image tags into GitOps manifests..."
          # The regex 'image: .*freelance-backend:.*' ensures it always finds the line and replaces the whole thing
          sed -i -E "s|image: .*freelance-backend:.*|image: docker.io/harshvardhan2003/freelance-backend:${{ github.run_id }}|g" apps/backend/backend-manifests.yaml
          sed -i -E "s|image: .*freelance-frontend:.*|image: docker.io/harshvardhan2003/freelance-frontend:${{ github.run_id }}|g" apps/frontend/frontend-manifests.yaml
          
          echo "Committing and pushing changes..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/backend/backend-manifests.yaml apps/frontend/frontend-manifests.yaml
          git commit -m "Deploy tag ${{ github.run_id }} via CI"
          git push origin main

      - name: Post-Build Cleanup
        if: always()
        run: |
          echo "Cleaning up dangling images inside Minikube to save disk space..."
          # This clears out the old, replaced images inside the cluster
          minikube ssh -- docker image prune -f || true