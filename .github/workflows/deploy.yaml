name: Local GitOps Lifecycle (WSL)

on:
  push:
    branches: [ minikube ]
  workflow_dispatch:

jobs:
  build-and-update-gitops:
    runs-on: self-hosted

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build and Push to Local Registry
        run: |
          echo "Starting robust port-forward on port 5050..."
          kubectl port-forward --namespace kube-system service/registry 5050:80 > pf.log 2>&1 &
          
          echo "Waiting for registry to wake up..."
          sleep 5
          
          echo "Verifying registry connection..."
          curl -s http://localhost:5050/v2/ > /dev/null || (echo "Port forward failed!" && cat pf.log && exit 1)
          
          echo "Building images..."
          podman build -t localhost:5050/freelance-backend:${{ github.run_id }} ./backend
          podman build -t localhost:5050/freelance-frontend:${{ github.run_id }} ./frontend
          
          echo "Pushing images to the cluster..."
          podman push --tls-verify=false localhost:5050/freelance-backend:${{ github.run_id }}
          podman push --tls-verify=false localhost:5050/freelance-frontend:${{ github.run_id }}

      - name: Update GitOps Repository
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          echo "Cloning GitOps repository..."
          git clone https://x-access-token:${GITOPS_PAT}@github.com/HarshvardhanPandey2003/freelance-bidding-gitops.git
          cd freelance-bidding-gitops
          
          echo "Injecting local registry tags into GitOps manifests..."
          # ⚠️ IMPORTANT: Use 5000 here (cluster internal port)
          sed -i -E "s|image: .*freelance-backend:.*|image: localhost:5000/freelance-backend:${{ github.run_id }}|g" apps/backend/backend-manifests.yaml
          sed -i -E "s|image: .*freelance-frontend:.*|image: localhost:5000/freelance-frontend:${{ github.run_id }}|g" apps/frontend/frontend-manifests.yaml
          
          echo "Committing and pushing changes..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/backend/backend-manifests.yaml apps/frontend/frontend-manifests.yaml
          git commit -m "Deploy tag ${{ github.run_id }} via CI" || echo "No changes to commit"
          git push origin main

      - name: Post-Build Cleanup
        if: always()
        run: |
          echo "Cleaning up local build cache..."
          podman image prune -f || true
          
          echo "Killing port-forward process..."
          pkill -f "kubectl port-forward" || true