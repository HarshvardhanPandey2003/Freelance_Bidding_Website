name: GitOps Build & Manifest Update

on:
  push:
    branches: [ minikube ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: self-hosted
    outputs:
      new_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Version Tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Backend (Podman)
        run: |
          podman build -t localhost:35319/freelance-backend:${{ steps.vars.outputs.sha_short }} ./backend
          podman push localhost:35319/freelance-backend:${{ steps.vars.outputs.sha_short }}

      - name: Build Frontend (Podman)
        run: |
          podman build -t localhost:35319/freelance-frontend:${{ steps.vars.outputs.sha_short }} ./frontend
          podman push localhost:35319/freelance-frontend:${{ steps.vars.outputs.sha_short }}

      - name: Local Cleanup
        if: always()
        run: podman image prune -f

  update-gitops-repo:
    name: Update GitOps Manifests
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/freelance-bidding-gitops
          token: ${{ secrets.GITOPS_PAT }} # Requires a PAT with 'repo' scope
          path: gitops-repo

      - name: Update Image Tags in Manifests
        run: |
          NEW_TAG="${{ needs.build-and-push.outputs.new_tag }}"
          
          echo "Updating backend manifest to tag: $NEW_TAG"
          # We use '|' as a delimiter in sed because the image name contains '/'
          sed -i "s|image: localhost:5000/freelance-backend:.*|image: localhost:5000/freelance-backend:$NEW_TAG|g" \
            gitops-repo/apps/backend/backend-manifests.yaml
          
          echo "Updating frontend manifest to tag: $NEW_TAG"
          sed -i "s|image: localhost:5000/freelance-frontend:.*|image: localhost:5000/freelance-frontend:$NEW_TAG|g" \
            gitops-repo/apps/frontend/frontend-manifests.yaml

      - name: Commit and Push to GitOps Repo
        working-directory: gitops-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update images to tag ${{ needs.build-and-push.outputs.new_tag }} [skip ci]" || echo "No changes to commit"
          git push origin main