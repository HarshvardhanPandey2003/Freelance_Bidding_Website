name: Local GitOps Lifecycle (WSL)

on:
  push:
    branches: [ minikube ]
  workflow_dispatch:

jobs:
  build-and-update-gitops:
    runs-on: self-hosted
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build and Patch Images (Podman)
        run: |
          echo "Building images with tag: ${{ github.run_id }}"
          echo "Saving images to physical tar archives (Docker format)..."
          # FORCE the Docker format so Minikube doesn't choke on OCI formats
          podman save --format docker-archive -o backend.tar docker.io/harshvardhan2003/freelance-backend:${{ github.run_id }}
          podman save --format docker-archive -o frontend.tar docker.io/harshvardhan2003/freelance-frontend:${{ github.run_id }}
          
          echo "Saving images to physical tar archives..."
          podman save -o backend.tar docker.io/harshvardhan2003/freelance-backend:${{ github.run_id }}
          podman save -o frontend.tar docker.io/harshvardhan2003/freelance-frontend:${{ github.run_id }}

      - name: Sideload Images to Minikube
        timeout-minutes: 3
        run: |
          echo "Loading physical tar archives directly into Minikube..."
          minikube image load backend.tar
          minikube image load frontend.tar

      - name: Update GitOps Repository
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          echo "Cloning GitOps repository..."
          # Clone the repo using the PAT for authentication
          git clone https://x-access-token:${GITOPS_PAT}@github.com/HarshvardhanPandey2003/freelance-bidding-gitops.git
          cd freelance-bidding-gitops
          
          echo "Injecting new image tags into GitOps manifests..."
          # The regex 'image: .*freelance-backend:.*' ensures it always finds the line and replaces the whole thing
          sed -i -E "s|image: .*freelance-backend:.*|image: docker.io/harshvardhan2003/freelance-backend:${{ github.run_id }}|g" apps/backend/backend-manifests.yaml
          sed -i -E "s|image: .*freelance-frontend:.*|image: docker.io/harshvardhan2003/freelance-frontend:${{ github.run_id }}|g" apps/frontend/frontend-manifests.yaml
          
          echo "Committing and pushing changes..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/backend/backend-manifests.yaml apps/frontend/frontend-manifests.yaml
          git commit -m "Deploy tag ${{ github.run_id }} via CI"
          git push origin main

      - name: Post-Build Cleanup
        if: always()
        run: |
          echo "Cleaning up dead containers and dangling images to save disk space..."
          podman container prune -f || true
          podman image prune -f || true
          rm -f backend.tar frontend.tar