name: Local DevOps Lifecycle (WSL)

on:
  push:
    branches: [ minikube ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    env:
      NAMESPACE: freelance-hub
      BACKEND_IMG: harshvardhan2003/freelance-backend
      FRONTEND_IMG: harshvardhan2003/freelance-frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Ensure Namespace Exists
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      # NEW PATCH (Unique tagging + no-cache builds)
      - name: Build and Tag Images (Podman)
        run: |
          echo "Building fresh images..."
          podman build --no-cache -t localhost/${{ env.BACKEND_IMG }} ./backend
          podman build --no-cache -t localhost/${{ env.FRONTEND_IMG }} ./frontend

          echo "Tagging with unique GitHub Run ID..."
          podman tag localhost/${{ env.BACKEND_IMG }} ${{ env.BACKEND_IMG }}:${{ github.run_id }}
          podman tag localhost/${{ env.FRONTEND_IMG }} ${{ env.FRONTEND_IMG }}:${{ github.run_id }}

      # Updated sideload with unique tags
      - name: Sideload Images to Minikube
        run: |
          echo "Injecting images into Minikube..."
          minikube image load ${{ env.BACKEND_IMG }}:${{ github.run_id }}
          minikube image load ${{ env.FRONTEND_IMG }}:${{ github.run_id }}

      - name: Validate Kubernetes Manifests
        run: |
          kubectl apply --dry-run=client -f k8s-manifests/configmaps/
          kubectl apply --dry-run=client -f k8s-manifests/deployments/

      - name: Generate Local Secrets File
        run: |
          mkdir -p k8s-manifests/secrets

          cat <<EOF > k8s-manifests/secrets/local-secrets.yaml
          apiVersion: v1
          kind: Secret
          metadata:
            name: backend-secrets-k8s
          type: Opaque
          stringData:
            MONGODB_URI: "${{ secrets.MONGODB_URI }}"
            MONGODB_URL: "${{ secrets.MONGODB_URI }}"
            JWT_SECRET: "${{ secrets.JWT_SECRET }}"
            RAZORPAY_KEY_ID: "${{ secrets.RAZORPAY_KEY_ID }}"
            RAZORPAY_KEY_SECRET: "${{ secrets.RAZORPAY_KEY_SECRET }}"
          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: frontend-secrets-k8s
          type: Opaque
          stringData:
            VITE_RAZORPAY_KEY: "${{ secrets.RAZORPAY_KEY_ID }}"
          EOF

      - name: Infrastructure Sync
        run: |
          kubectl apply -f k8s-manifests/secrets/local-secrets.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f k8s-manifests/configmaps/app-config.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f k8s-manifests/autoscaling/hpa-combined.yaml -n ${{ env.NAMESPACE }}

      # Inject dynamic image tags (CRITICAL FIX)
      - name: Inject Image Tags into Manifests
        run: |
          sed -i "s|${{ env.BACKEND_IMG }}:latest|${{ env.BACKEND_IMG }}:${{ github.run_id }}|g" k8s-manifests/deployments/backend.yaml
          sed -i "s|${{ env.FRONTEND_IMG }}:latest|${{ env.FRONTEND_IMG }}:${{ github.run_id }}|g" k8s-manifests/deployments/frontend.yaml

      - name: Deploy Application
        run: |
          kubectl apply -f k8s-manifests/deployments/redis.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f k8s-manifests/deployments/backend.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f k8s-manifests/deployments/frontend.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f k8s-manifests/ingress/ingress.yaml -n ${{ env.NAMESPACE }}

      # Removed rollout restart (not needed anymore due to unique tags)

      - name: Deployment Health Check
        run: |
          kubectl rollout status deployment/backend -n ${{ env.NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Cleanup
        if: always()
        run: |
          podman container prune -f || true
          podman image prune -f || true

      - name: Output URLs
        run: |
          echo "Frontend: http://freelance.local"
          echo "Backend: http://freelance.local/api"