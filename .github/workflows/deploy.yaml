name: Local GitOps Lifecycle (WSL)

on:
  push:
    branches: [ minikube ]
  workflow_dispatch:

jobs:
  build-and-update-gitops:
    runs-on: self-hosted
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Connect to Local Registry
        run: |
          echo "Port-forwarding Minikube registry to host..."
          # Run port-forward in the background so the pipeline can continue
          kubectl port-forward --namespace kube-system service/registry 5000:80 &
          # Give it a few seconds to establish the connection
          sleep 5

      - name: Build and Push to Local Registry
        run: |
          echo "Building images natively on WSL..."
          # Note the tag changed from docker.io to localhost:5000
          podman build -t localhost:5000/freelance-backend:${{ github.run_id }} ./backend
          podman build -t localhost:5000/freelance-frontend:${{ github.run_id }} ./frontend
          
          echo "Pushing images directly into Minikube's internal registry..."
          # --tls-verify=false is required because localhost doesn't have an SSL cert
          podman push --tls-verify=false localhost:5000/freelance-backend:${{ github.run_id }}
          podman push --tls-verify=false localhost:5000/freelance-frontend:${{ github.run_id }}

      - name: Update GitOps Repository
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          echo "Cloning GitOps repository..."
          git clone https://x-access-token:${GITOPS_PAT}@github.com/HarshvardhanPandey2003/freelance-bidding-gitops.git
          cd freelance-bidding-gitops
          
          echo "Injecting local registry tags into GitOps manifests..."
          # Update Frontend and Backend to point to localhost:5000
          sed -i -E "s|image: .*freelance-backend:.*|image: localhost:5000/freelance-backend:${{ github.run_id }}|g" apps/backend/backend-manifests.yaml
          sed -i -E "s|image: .*freelance-frontend:.*|image: localhost:5000/freelance-frontend:${{ github.run_id }}|g" apps/frontend/frontend-manifests.yaml
          
          echo "Committing and pushing changes..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/backend/backend-manifests.yaml apps/frontend/frontend-manifests.yaml
          git commit -m "Deploy tag ${{ github.run_id }} via CI"
          git push origin main

      - name: Post-Build Cleanup
        if: always()
        run: |
          echo "Cleaning up local build cache..."
          podman image prune -f || true
          
          echo "Killing port-forward process..."
          pkill -f "kubectl port-forward" || true